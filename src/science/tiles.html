<div class="tiles tiles6 sm-v2">
      <button class="tile sm-hero" data-mode="sp" id="tSp">
        <svg class="sm-hero-art" viewBox="-60 -70 120 130" aria-hidden="true"><use href="#smAstro"/></svg>
        <span class="sm-hero-txt"><span class="tname">Space Mission</span><span class="tsub">太空探险 · 科学大题</span>
          <span class="sm-hbar"><i id="smBar"></i></span><span class="sm-hnote" id="smNote"></span><span class="sm-hgo">🚀 发射 Go!</span></span>
      </button>
      <button class="tile" data-mode="tool" id="tTool">
        <span class="glyph"><svg viewBox="0 0 40 38"><rect x="5" y="13" width="30" height="19" rx="4"/><path d="M14 13V9a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v4M5 21h30"/></svg></span>
        <span><span class="tname">Answer toolbox</span><span class="tsub">句式工具箱</span><span class="tnote" id="toolNote"></span></span>
      </button>
      <button class="tile sm-t3" data-mode="skill" id="tSkill">
        <span class="glyph"><svg viewBox="0 0 40 38"><circle cx="17" cy="17" r="10"/><path d="M25 25l9 9"/></svg></span>
        <span><span class="tname">Answer skills</span><span class="tsub">答题本领</span></span>
      </button>
      <button class="tile sm-t3" data-mode="cards" id="tCards">
        <span class="glyph"><svg viewBox="0 0 40 38"><rect x="6" y="8" width="22" height="26" rx="3"/><path d="M13 4h19a3 3 0 0 1 3 3v22"/></svg></span>
        <span><span class="tname">Word cards</span><span class="tsub">单词卡 · 必会句</span><span class="tnote" id="wtNote"></span></span>
      </button>
      <!-- v4.72: these moved into the planets of Space Mission (P4 / living things / materials / body) or the star card (my stars);
           kept hidden so old links and tests still reach them -->
      <div class="sm-gone" hidden>
        <button class="tile mini" data-mode="p4" id="tP4"><span class="tname">P4 Preview</span></button>
        <button class="tile mini" data-mode="me" id="tMe"><span class="tname">My stars</span></button>
        <button class="tile mini" data-mode="life" id="tLife"><span class="tname">Living things</span></button>
        <button class="tile mini" data-mode="mat" id="tMat"><span class="tname">Materials</span></button>
        <button class="tile mini bd-entry" data-mode="body" id="tBody"><span class="tname">Body Explorer</span><span class="tnote" id="bdNote"></span></button>
      </div>
      <button class="tile" data-mode="redo" id="tRedo">
        <span class="glyph"><svg viewBox="0 0 40 38"><path d="M30 12a12 12 0 1 0 2 11"/><path d="M31 5v8h-8"/></svg></span>
        <span><span class="tname">Try again</span><span class="tsub">错题重练</span><span class="tnote" id="redoNote"></span></span>
      </button>
      <button class="tile lb-tile" data-mode="lab" id="tLab">
        <span class="lb-ic" aria-hidden="true">🔦🥄🧲</span>
        <span><span class="tname">Home Lab</span><span class="tsub">家里实验室 · 和大人一起做实验</span><span class="tnote" id="labNote"></span></span>
      </button>
    </div>
