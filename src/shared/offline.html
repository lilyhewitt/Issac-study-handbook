<script>
/* Offline: register the site's service worker (sw.js at the site root). The first time all pages are
   saved on this device, say so once. */
(function(){
  if(!('serviceWorker' in navigator)||location.protocol==='file:')return;
  var root=new URL(window.__SWROOT||'../',location.href);
  navigator.serviceWorker.register(new URL('sw.js',root).href,{scope:root.href}).catch(function(){});
  var K='offline-ready-v2';try{if(localStorage.getItem(K))return;}catch(e){return;}
  var tries=0;(function check(){
    if(++tries>20||!window.caches)return;
    caches.open('xx-offline-v2').then(function(c){return Promise.all(['','math/','english/','science/'].map(function(p){return c.match(new URL(p,root).href);}));})
    .then(function(r){if(r.every(Boolean)){try{localStorage.setItem(K,'1');}catch(e){}
      var d=document.createElement('div');d.textContent='✓ 已存到这台设备，没网也能用';
      d.style.cssText='position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1E4A46;color:#fff;padding:10px 16px;border-radius:14px;font:600 15px system-ui,sans-serif;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.2)';
      document.body.appendChild(d);setTimeout(function(){d.remove();},4000);}else setTimeout(check,1500);}).catch(function(){});
  })();
})();
</script>
