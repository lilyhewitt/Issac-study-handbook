  <!-- PHRASES (介词词组): its own deck, separate from the word cards -->
  <section id="vPP" class="view" aria-label="Phrases" hidden>
    <div class="qbar">
      <button class="iconbtn" id="ppBack" aria-label="Back to home"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2 class="st-h">Phrases 介词词组</h2>
    </div>
    <div class="stcard" id="ppSum"></div>
    <button class="btn" id="ppReview">复习今天的词组</button>
    <p class="st-note">灰色 = 还没学 · 黄色 = 在复习 · 绿色 = 记住了 · 红色 = 最近答错，会再出现。颜色标出来的是要记住的小词。</p>
    <div class="st-list" id="ppSets"></div>
  </section>

  <section id="vPPCard" class="view" aria-label="Phrase card" hidden>
    <div class="qbar">
      <button class="iconbtn" id="ppcQuit" aria-label="Back to phrases"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="pips" id="ppcPips"></div>
    </div>
    <div class="wcard">
      <div class="wc-set" id="ppcSet"></div>
      <div class="wc-word pp-word" id="ppcWord"></div>
      <button class="tool" id="ppcSay"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6"/></svg>Listen</button>
      <div class="wc-zh" id="ppcZh"></div>
      <div class="wc-ex" id="ppcEx"></div>
      <div class="wc-tip">整块读三遍，把颜色标出来的小词读重一点。<br>Say it three times as one piece.</div>
    </div>
    <button class="btn" id="ppcNext">Next 下一个</button>
  </section>
